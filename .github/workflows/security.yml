name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify project license and release policy
        run: |
          test -s LICENSE
          grep -q "Apache License" LICENSE
          grep -q "CycloneDX" docs/releases/policy.md
