name: Bug report
description: Report reproducible ArchGauge behavior
body:
  - type: textarea
    id: observed
    attributes: { label: Observed behavior }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction and version }
    validations: { required: true }
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report contains no secrets or private repository content
          required: true
